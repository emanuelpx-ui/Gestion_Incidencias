# =========================================================================
# CONFIGURACIÓN BASE - SISTEMA DE GESTIÓN DE INCIDENCIAS
# =========================================================================
spring.application.name=devdesk-tickets

# --- Conexión a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${POSTGRES_DB:sistema_tickets_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway (Migraciones de BD) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Seguridad / JWT ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Paginación ---
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --- Rate limiting (Anti fuerza bruta) ---
app.rate-limit.enabled=true
app.rate-limit.capacity=5
app.rate-limit.refill-minutes=1

# --- Zona horaria ---
spring.jackson.time-zone=America/Mexico_City

# --- Servidor ---
server.port=8080
server.forward-headers-strategy=framework
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# =========================================================================
# CONFIGURACIÓN DE CORREO (SMTP) - Nuevo
# =========================================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true