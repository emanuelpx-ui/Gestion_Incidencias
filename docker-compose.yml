# =========================================================================
# SISTEMA DE GESTIÓN DE INCIDENCIAS - Entorno Local Integrado
# =========================================================================
version: '3.8'

services:

  # ----------------------------------------------------------------------
  # Base de datos PostgreSQL
  # ----------------------------------------------------------------------
  postgres-db:
    image: postgres:17-alpine
    container_name: devdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Mexico_City
    ports:
      - "5435:5432" # Expuesto para que puedas conectarte con DBeaver/pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devdesk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------
  # Backend Spring Boot
  # ----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devdesk_backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080" # Expuesto para Postman/Swagger
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-3600000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      LOGGING_LEVEL_COM_DEVDESK_GESTION_INCIDENCIAS: DEBUG
    networks:
      - devdesk_net

  # ----------------------------------------------------------------------
  # Frontend React + Vite
  # ----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: devdesk_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:8080" # Expuesto en el puerto 80 local
    networks:
      - devdesk_net

networks:
  devdesk_net:
    driver: bridge

volumes:
  postgres_data: